syntax = "proto3";

package killfeed;

// Service for detecting killfeeds and determining their status
service KillfeedDetectionService {
  // Process a frame to detect killfeeds and determine status
  rpc ProcessFrame(ProcessFrameRequest) returns (ProcessFrameResponse);
}

// Request message containing the full frame image
message ProcessFrameRequest {
  bytes frame_image = 1;  // Full frame image as JPEG/PNG bytes
  int32 frame_width = 2;  // Original frame width
  int32 frame_height = 3; // Original frame height
}

// Response message containing detection results
message ProcessFrameResponse {
  repeated DetectionResult detections = 1;
  bool success = 2;
  string error_message = 3;
}

// Individual detection result
message DetectionResult {
  bytes cropped_image = 1;  // Cropped killfeed image as JPEG/PNG bytes
  string status = 2;         // Status: "KNOCKED", "KILL", or "REVIVED"
  BoundingBox bbox = 3;      // Bounding box coordinates
  float confidence = 4;      // Detection confidence (0.0 to 1.0)
  repeated string detection_sources = 5; // Sources that detected REVIVED (empty for KNOCKED/KILL)
}

// Bounding box coordinates
message BoundingBox {
  int32 x1 = 1;  // Left coordinate
  int32 y1 = 2;  // Top coordinate
  int32 x2 = 3;  // Right coordinate
  int32 y2 = 4;  // Bottom coordinate
}

